server {
    listen 80;
    server_name localhost;

    # ─── Frontend static files ───────────────────────────────────────────────
    root /var/www/html;
    index index.html;

    # Global CORS headers
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Range, Origin, Accept, Content-Type, Authorization' always;

    # Handle CORS pre-flight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ─── HLS static media ────────────────────────────────────────────────────
    # URL:  http://host/hls/<video_slug>/index.m3u8
    # File: /data/hls/<video_slug>/index.m3u8
    location /hls/ {
        alias /data/hls/;

        types {
            application/vnd.apple.mpegurl  m3u8;
            video/mp2t                     ts;
            video/iso.segment              m4s;
            application/dash+xml           mpd;
        }

        # Playlists must never be cached; segments can be cached
        location ~* \.m3u8$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma         "no-cache"                           always;
            add_header Expires        "0"                                  always;
            add_header Access-Control-Allow-Origin * always;
        }

        location ~* \.(ts|m4s)$ {
            add_header Cache-Control "public, max-age=3600" always;
            add_header Access-Control-Allow-Origin * always;
        }

        add_header Accept-Ranges bytes always;
        try_files $uri =404;
    }

    # ─── Backend API (FastAPI) ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─── SPA fallback ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
